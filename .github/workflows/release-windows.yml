name: Build and upload Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install pinned build compiler
        shell: powershell
        run: |
          New-Item .tools/inno -ItemType Directory -Force | Out-Null
          $download = '.tools/inno/innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ine '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Compiler checksum mismatch' }
          if ((Get-AuthenticodeSignature $download).Status -ne 'Valid') { throw 'Compiler signature is invalid' }
          $directory = Join-Path (Get-Location) '.tools/inno/compiler'
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="'+$directory+'"')) -WindowStyle Hidden -PassThru
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }

      - name: Build verified Windows application
        shell: powershell
        run: .\scripts\build-app.ps1 -OutputDirectory .\dist

      - name: Verify packaged application and setup lifecycle
        shell: powershell
        run: |
          & .\dist\app-package\engine\runtime\node\node.exe --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          foreach ($test in @('codex-connection.tests.ps1','distribution-cleanup.tests.ps1','uninstall-app.tests.ps1','app-package.tests.ps1')) {
            & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File (Join-Path tests $test)
            if ($LASTEXITCODE -ne 0) { throw "Application test failed: $test" }
          }
          & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File installer/verify-setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Setup lifecycle test failed' }

      - name: Upload release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$env:RELEASE_TAG" .\dist\Codex-Skin-Manager-Setup.exe .\dist\*.zip .\dist\*.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
